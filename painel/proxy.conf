# Comum a todos os painéis: proxy para os nós e para o fornecedor.
# O resolver do Docker com "set $..." resolve os nomes a cada pedido: se um nó estiver parado,
# só os pedidos a esse nó falham (502) e o painel continua a funcionar.
resolver 127.0.0.11 valid=5s ipv6=off;
root /usr/share/nginx/html;
index index.html;
proxy_connect_timeout 2s;
proxy_read_timeout 20s;

location /api/norte/      { set $alvo no-norte:8080;        rewrite ^/api/norte/(.*)$ /api/$1 break;      proxy_pass http://$alvo; }
location /api/centro/     { set $alvo no-centro:8080;       rewrite ^/api/centro/(.*)$ /api/$1 break;     proxy_pass http://$alvo; }
location /api/sul/        { set $alvo no-sul:8080;          rewrite ^/api/sul/(.*)$ /api/$1 break;        proxy_pass http://$alvo; }
location /api/fornecedor/ { set $alvo fornecedor-mock:8090; rewrite ^/api/fornecedor/(.*)$ /api/$1 break; proxy_pass http://$alvo; }

location / {
    try_files $uri /index.html;
}
