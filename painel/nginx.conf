# Um painel por armazém, cada um na sua porta (8081 NORTE, 8082 CENTRO, 8083 SUL) e uma vista geral (8080).
# A aplicação é a mesma; /regiao.json diz-lhe qual é o "seu" armazém.
server {
    listen 8080;
    location = /regiao.json { default_type application/json; return 200 '{"regiao":null}'; }
    include /etc/nginx/scad/proxy.conf;
}
server {
    listen 8081;
    location = /regiao.json { default_type application/json; return 200 '{"regiao":"NORTE"}'; }
    include /etc/nginx/scad/proxy.conf;
}
server {
    listen 8082;
    location = /regiao.json { default_type application/json; return 200 '{"regiao":"CENTRO"}'; }
    include /etc/nginx/scad/proxy.conf;
}
server {
    listen 8083;
    location = /regiao.json { default_type application/json; return 200 '{"regiao":"SUL"}'; }
    include /etc/nginx/scad/proxy.conf;
}
