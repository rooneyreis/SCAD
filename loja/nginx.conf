# Loja (clientes) na porta 8085. Só expõe a API pública da loja de cada nó (/api/<região>/loja/...):
# a autorização de pedidos e o resto da API dos nós ficam acessíveis apenas aos painéis dos armazéns.
server {
    listen 8085;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 1s;           # um nó parado deixa de existir no DNS do Docker: falhar depressa
    proxy_connect_timeout 1s;
    proxy_read_timeout 20s;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/api/(norte|centro|sul)/loja/(.*)$ {
        set $alvo no-$1:8080;
        rewrite ^/api/\w+/loja/(.*)$ /api/loja/$1 break;
        proxy_pass http://$alvo;
    }
    location /api/ { return 404; }
    location / { try_files $uri /index.html; }
}
