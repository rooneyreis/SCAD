server:
  port: 8080

spring:
  autoconfigure:
    # As ligações à BD são geridas por FragmentosBd (uma por fragmento), não por uma DataSource única
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  jackson:
    serialization:
      write-dates-as-timestamps: false

scad:
  regiao: ${NO_REGIAO:NORTE}
  corba:
    host-anunciado: ${CORBA_HOST_ANUNCIADO}
    porta: ${CORBA_PORTA:3701}
    naming: ${CORBA_NAMING}
  hdfs:
    uri: ${HDFS_URI}
    utilizador: ${HDFS_UTILIZADOR:scad}
    replicacao: ${HDFS_REPLICACAO:3}
  bd:
    nome: ${PG_BD:scad}
    utilizador: ${PG_UTILIZADOR:scad}
    password: ${PG_PASSWORD:scad}
  fragmentos:
    "[NORTE]":
      primario: ${PG_NORTE_PRIMARIO:}
      replica: ${PG_NORTE_REPLICA:}
    "[CENTRO]":
      primario: ${PG_CENTRO_PRIMARIO:}
      replica: ${PG_CENTRO_REPLICA:}
    "[SUL]":
      primario: ${PG_SUL_PRIMARIO:}
      replica: ${PG_SUL_REPLICA:}
  relogio:
    desvio-simulado-ms: ${CLOCK_SKEW_MS:0}
  # Pares do grupo (Ricart-Agrawala e detector de falhas): REGIAO=url,REGIAO=url,...
  pares: ${SCAD_PARES:}
  exclusao:
    timeout-ms: ${SCAD_EXCLUSAO_TIMEOUT_MS:30000}
  demo:
    # Tempo extra dentro da secção crítica, para se ver a fila do Ricart-Agrawala no painel
    demora-seccao-critica-ms: ${SCAD_DEMORA_SC_MS:2000}

logging:
  level:
    org.jacorb: WARN
    org.apache.hadoop: WARN
    com.zaxxer.hikari: WARN
